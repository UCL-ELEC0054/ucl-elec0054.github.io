- id: proj-013
  title: "Forecast-Aware Energy Management for Residential Solar-Battery Systems"
  supervisor: "Boli Chen"
  co_supervisors:
    - "Francesca Boem"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - control-systems
    - machine-learning-ai
    - signal-processing
  description: |
    Project Overview
    As residential solar and battery adoption grows, the ability to optimally manage local energy flows becomes critical—especially under uncertainty from PV generation and load demand. This project explores the integration of machine learning-based PV forecasting with real-time inverter control optimisation, enabling smarter, more reliable, and more cost-effective operation of residential energy systems.
    This project will develop and test an integrated pipeline for short-term PV power forecasting (15–60 minutes ahead) using historical irradiance and weather data, and use these forecasts to drive optimisation of battery charge/discharge profiles, inverter control (i.e., MPPT), under varying objectives (e.g. self-consumption, carbon intensity, curtailment).
    The project will explore strategies to handle real-world challenges such as data sparsity, forecast uncertainty, and non-stationary (e.g., rapid changing) solar conditions. Optional extensions may include uncertainty quantification, adaptive model updating, or multi-modal feature integration.

    Scope of Tasks
    • Data Analysis & Forecasting
    • Explore PV generation datasets (e.g. from open repositories or Fuse Energy).
    • Train and evaluate forecasting models (e.g. LSTM, Temporal Fusion Transformers).
    • Assess model performance under different weather conditions and time horizons.
    • Forecast-Informed Optimisation
    • Formulate an optimisation problem for battery operation and inverter setpoints using forecast inputs.
    • The optimisation will consider the following key objectives:
    • Maximising energy efficiency, including improved MPPT performance and smart inverter control to increase self-consumption and reduce energy waste.
    • Minimising operating costs, such as reducing grid import during high-price periods, and battery degradation
    • Maximising financial returns, by exporting excess PV energy when prices are favourable, based on real-time or forecasted energy prices.
    • Simulation & Visualisation
    • Build a simulation framework to evaluate system performance.
    • Compare against baseline methods (e.g. rule-based scheduling).
  prerequisites: >
    Strong programming skills (Python or MATLAB). Familiarity with machine learning. Interest in
    optimisation, energy systems, or control.
  available: true

