  description: >
    This project builds on PKPDai’s existing NLP pipeline for automated extraction of
    pharmacokinetic parameters from biomedical literature. Using state-of-the-art relation
    extraction and entity-linking models, the student will apply transfer learning to adapt these
    algorithms to identify and extract pharmacodynamic parameters such as IC/EC₅₀, Emax, and MIC,
