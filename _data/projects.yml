- id: proj-016
  title: "Electromagnetic pulse synchroniser for inertial sensors"
  supervisor: "Thomas Gilbert"
  co_supervisors:
    - "Sally Day"
  programmes:
    - wireless-and-optical-communications
    - integrated-machine-learning-systems
    - internet-engineering
    - telecommunications
  research_areas:
    - sensing-imaging
    - integrated-circuits-microelectronics
    - microwave-rf-thz
  description: |
    Project Description
    This individual project focuses on the design and development of a hardware-based electromagnetic (EM) synchronisation system for wearable inertial measurement units (IMUs). The work explicitly bridges the gap between recent academic research and a commercial motion-capture solution, by applying synchronisation protocols demonstrated at short range to a larger-scale EM hardware platform.
    The project draws on two key references:
    • The Frontiers in Computer Science paper
    Magnetometer-Based In-Situ Synchronisation of Inertial Measurement Units, which demonstrates high-precision, successful time synchronisation of IMUs using magnetometer-detected electromagnetic events, but only at very short distances (≈10 cm) between the EM source and sensors.
    • The commercial Rokoko Coil Pro system, which uses a dedicated electromagnetic field generator to interact with IMUs over a much larger capture volume, achieving magnetic interference with wearable sensors at distances of up to ~2 m.
    The core challenge addressed in this project is that while the paper proves the synchronisation concept with excellent precision, it does not scale spatially, whereas Rokoko’s hardware demonstrates large-area magnetic influence but does not disclose its internal synchronisation protocols.
    In this project, the student will take the synchronisation protocols and signal concepts described in the research paper and apply them to hardware inspired by the Rokoko Coil Pro, with the goal of exploring how EM-based synchronisation performance changes when scaled from centimetre-range laboratory setups to metre-scale systems.

    Technical Scope
    The project is expected to include:
    • Design of a coil-based electromagnetic field generator inspired by Rokoko Coil Pro–style hardware, prioritising field reach and repeatability.
    • Integration of IMU sensor nodes with magnetometers, capable of logging high-resolution, timestamped data.
    • Embedded firmware implementing:
    o EM event detection based on the paper’s methodology
    o Timestamp alignment and synchronisation
    • Experimental testing across varying distances (from centimetres to metres) to compare:
    o Synchronisation accuracy
    o Detection reliability
    o Sensitivity to movement and environmental noise
    Use of platforms such as Arduino, ESP32, or STM32 is appropriate, with optional PCB design for the EM generator or sensor nodes.

    Deliverables
    The student will produce:
    1. A functional hardware prototype demonstrating EM-based synchronisation at distances beyond those reported in the paper.
    2. Embedded firmware implementing the synchronisation protocol.
    3. A technical report comparing:
    o Short-range results from the literature
    o Experimental results from the scaled hardware system
    4. A demonstration showing synchronisation of multiple IMUs at extended range.
  prerequisites: "Knowledge in embedded design and electromagnetic principles"
  available: false

- id: proj-017
  title: "Intelligent Wireless Sensing for Smart Grid"
  supervisor: "Tongyang Xu"
  co_supervisors:
    - "Boli Chen"
  programmes:
    - telecommunications
    - integrated-machine-learning-systems
    - internet-engineering
    - wireless-and-optical-communications
  research_areas:
    - wireless-communications
    - sensing-imaging
    - machine-learning-ai
  description: |
    Modern smart grids rely on accurate, timely, and scalable sensing to monitor grid states such as load conditions, fault events, equipment health, and power quality. Wireless sensing technologies offer flexibility and cost advantages, but face challenges including limited bandwidth, interference, latency constraints, and stringent reliability requirements. Intelligent wireless sensing aims to address these challenges by tightly integrating sensing, communication, and artificial intelligence. This MSc project focuses on the theoretical modeling and simulation-based design of intelligent wireless sensing systems for smart grid applications. Rather than treating sensing and communication as separate layers, the project investigates joint sensing and communication frameworks where sensing objectives, signal design, and data transmission strategies are optimized together. AI-based algorithms will be explored to extract grid information from wireless measurements while efficiently using spectrum and energy resources.

    The project will study theory-driven models for wireless smart grid sensing, including signal and system models for grid monitoring scenarios (e.g., fault detection, state estimation, or anomaly detection). Building on these models, the student will develop learning-assisted algorithms and novel signal designs that improve sensing accuracy and robustness under realistic wireless channel conditions.

    Research Tasks will focus on:
    • System models for wireless sensing in smart grids
    • Novel signal and waveform design for smart grid sensing (e.g., non-orthogonal, compressed, or adaptive signals)
    • Performance metrics for grid-aware sensing (e.g., detection accuracy, estimation error, latency, reliability)
    • Development of intelligent sensing algorithms using machine learning and signal processing
    • Trade-offs between sensing fidelity, communication overhead, and computational complexity
    • Joint design of sensing signals and communication strategies
    • Simulation-based evaluation using MATLAB or Python under realistic channel and grid scenarios
    • Excellent results would be possible for IEEE publications.
  prerequisites: >
    (a)Solid background in signal processing, communications, power systems, or related fields.
    (b)Knowledge of machine learning or data-driven algorithms. (c)Foundation in signals and
    sensing systems. (d)Understanding of advanced signal design, waveform design, or modulation
    techniques. (e)Familiarity with smart grids, power system monitoring, or energy systems.
    (f)Programming experience in Python, MATLAB, or C/C++.
  available: false

- id: proj-018
  title: "Intelligent Wired Sensing for Smart Grid"
  supervisor: "Tongyang Xu"
  co_supervisors:
    - "Boli Chen"
  programmes:
    - integrated-machine-learning-systems
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - sensing-imaging
    - signal-processing
    - machine-learning-ai
  description: |
    Smart grids increasingly rely on dense sensing and monitoring to ensure reliability, efficiency, and resilience of power systems. In many grid segments, such as transmission networks, substations, and industrial distribution systems, wired sensing and communication infrastructures (e.g., power line communication, fiber-optic sensing, or industrial Ethernet) provide high reliability, security, and deterministic performance. However, these systems face challenges related to noise, interference, bandwidth constraints, and the growing volume of sensing data. This MSc project focuses on the theoretical modeling and simulation-based design of intelligent wired sensing systems for smart grids. The project explores how artificial intelligence and advanced signal processing can be integrated with wired communication technologies to enable task-oriented, data-efficient, and reliable grid sensing.

    The student will develop analytical models for wired sensing and communication channels and investigate novel signal designs and algorithms that improve sensing accuracy and robustness under realistic grid conditions. Emphasis is placed on joint sensing and communication design, where sensing objectives (e.g., fault detection, state estimation, equipment health monitoring) are explicitly considered in the communication and signal processing strategies.

    Research Tasks will focus on:
    • System and signal models for wired sensing in smart grids
    • Channel and noise modeling for wired links (e.g., PLC or fiber-based sensing)
    • Novel signal and waveform design for smart grid sensing (e.g., non-orthogonal, compressed, or adaptive signals)
    • Performance metrics for grid-aware sensing (e.g., detection accuracy, estimation error, latency, reliability)
    • Development of intelligent sensing algorithms using machine learning and signal processing
    • Trade-offs between sensing fidelity, communication overhead, and computational complexity
    • Joint design of sensing signals and communication strategies
    • Simulation-based evaluation using MATLAB or Python under realistic channel and grid scenarios
    • Excellent results would be possible for IEEE publications.
  prerequisites: >
    (a)Solid background in signal processing, communications, power systems, or related fields.
    (b)Knowledge of machine learning or data-driven algorithms. (c)Foundation in signals and
    sensing systems. (d)Understanding of advanced signal design, waveform design, or modulation
    techniques. (e)Familiarity with smart grids, power system monitoring, or energy systems.
    (f)Programming experience in Python, MATLAB, or C/C++.
  available: false

