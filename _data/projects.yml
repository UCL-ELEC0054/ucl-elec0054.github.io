- id: proj-066
  title: "Hardware-in-the-Loop and Bench Validation of RL-Based Active EMI Filtering"
  supervisor: "Boli Chen"
  co_supervisors:
    - "Yukun Hu"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - integrated-circuits-microelectronics
    - signal-processing
  description: |
    Modern electrified and intelligent vehicles rely on high-frequency power electronics such as electric drive units, DC–DC converters, and on-board chargers. These switching systems inevitably generate electromagnetic interference (EMI), which can degrade sensing accuracy, disrupt communication, and compromise reliability and safety. Conventional passive EMI filters are widely used but are often bulky, inefficient, and unable to adapt to time-varying operating conditions.

    Active EMI filters (AEFs) offer a more compact and flexible solution by injecting compensating signals to suppress noise. Our recent research proposes an intelligent self-tuning AEF based on reinforcement learning, enabling automatic real-time adaptation to changing EMI environments. Based at our joint lab - Dynamic Systems Lab, this project aims to design and experimentally validate a hardware prototype of the proposed system, providing practical evidence of its performance and robustness for automotive power-electronic applications.

    Key tasks will include:
    • Develop the experimental platform: design and assemble a 10 kHz bench-scale active EMI filtering rig, including the interference source, sensing modules, injection circuitry, and safe laboratory operation.
    • Characterise EMI behaviour: measure and analyse conducted noise using oscilloscope and FFT-based spectral methods, and establish repeatable performance metrics (e.g., attenuation in dB, ripple reduction).
    • Design and integrate intelligent control: implement a RL based self-tuning controller to adapt filter parameters in real time using measured EMI features.
    • Evaluate and report performance: benchmark all methods under varying operating conditions, analyse robustness and stability, and document results suitable for academic publication.

    The project offers valuable interdisciplinary experience in embedded systems, AI, and clean energy technology. It is ideal for students interested in real-time embedded AI, sustainable engineering, or smart infrastructure applications.

    Further reading
    • “Reinforcement Learning: An Introduction (2nd ed.)”, Sutton & Barto, http://incompleteideas.net/book/RLbook2020.pdf
    • “Active EMI filters to reduce size and cost of EMI filters in automotive systems”, Yongbin Chu, Yogesh Ramadass, 2021 https://www.ti.com/lit/an/slyt812/slyt812.pdf?ts=1769091222637&ref_url=https%253A%252F%252Fwww.google.com%252F
    • “Effects of Common-Mode Active Filtering in Induction Motor Drives for Electric Vehicles”, Maria Carmela Di Piazza et al, https://doi.org/10.1109/TVT.2010.2047661
  prerequisites: >
    Fundamental electronics lab skills, experience with MATLAB or Python, and basic understanding
    of signals, machine learning and control systems.
  available: false

- id: proj-067
  title: "Modelling liquid crystals in photonic devices (2 projects)"
  supervisor: "Sally Day"
  co_supervisors:
    - "David Selviah"
    - "Martyn Fice"
  programmes:
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - photonics-optics
    - semiconductors-materials-devices
  description: |
    A Fabry-Perot filter is a high Q optical filter, made by forming a cavity between two high reflectivity mirrors, which is also of course the basis of a laser system as well. There are two areas of interest in this type of device,
    (i) one is for the application of a tunable resonant optical filter, which has applications in optical telecom networks and in gas sensors.
    (ii) The second is to use a type of liquid crystal, called cholesteric, which has an inherent twist to the liquid crystal, which gives strong selective reflection over a band of wavelengths. This cholesteric liquid crystal can have laser dye included in the material, and the strong reflection provides the feedback in the material structure to give lasing action.

    Both the Fabry Perot Filter and the Cholesteric laser system can be modelled using the fundamental electromagnetic equations describing light
    propagation through anisotropic media, including loss and gain. Both projects would involve using an existing Python program to simulate the optical properties of either or both Fabry Perot filter and the cholesteric laser. The areas of interest are to study the polarisation sensitivity of the output from the filter and the laser as well as considering the off-axis performance and the wavelength tuning range of both systems. The
    performance can then be assessed in terms of the requirements for potential applications.

    An interest in modelling optics (electromagnetic waves) is necessary, but the methods used will be learned at the start of the project, so no specific knowledge of liquid crystals or detailed knowledge for the devices is required at the start of the project
  prerequisites: "An interest in modelling optics, but no specific knowledge is required."
  available: false

