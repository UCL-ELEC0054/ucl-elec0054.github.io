  description: >
    At UCL we are developing a way of trimming packets in case of congestion. This avoids loosing
    all the information and the need to synchronise prioritization queues across all the domains.
    In order for PPF to be useful, data needs to be encoded in the packets in a way that early bits
    are more important (have more information). This project will research how to implement PFF in
    routers and how to encode the most important data streams (video, audio, ML, etc) in a PPF
    friendly way.
