- id: proj-060
  title: "Coding schemes for mitigation of turbulent fading in free-space optical links"
  supervisor: "Martyn Fice"
  co_supervisors:
    - "Nathan Gomes"
  programmes:
    - telecommunications
    - internet-engineering
    - wireless-and-optical-communications
  research_areas:
    - optical-communications
    - wireless-communications
    - signal-processing
  description: |
    Free-space optical (FSO) links are of increasing interest for high-speed wireless communication systems spanning distances ranging from metres (e.g. in-room) to hundreds or even thousands of kilometres (e.g. ground-to-satellite or intersatellite). Longer outdoor ground-to-ground, ground-to-aerial-vehicle, or ground-to-satellite FSO links involve propagation through the turbulent atmosphere, resulting in signal fading due to scintillation or beam wander. Under conditions of high turbulence, this can lead to deep fades, resulting in an increase in errors in the received data or even complete link outage.

    This project will investigate techniques for mitigating the impact of atmospheric fading on FSO systems by coding the transmitted data. To start, a literature survey of coding schemes proposed and employed to date will be carried out, before moving on to model the performance of selected techniques (e.g. using MATLAB) under simulated turbulent atmospheric conditions. Experiments to test the schemes will be designed for and, if time allows, implemented in a laboratory based testbed which emulates atmospheric turbulence.
  prerequisites: "None"
  available: false
