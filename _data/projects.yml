  description: |
    This project aims to build an intelligent system that combines vision-language models (VLMs) with retrieval-augmented generation (RAG) to enhance understanding and reasoning in video game environments. The system will generate semantic descriptions of game scenes using VLMs and enrich these with relevant information retrieved from a curated knowledge base, such as game manuals or FAQs. By integrating visual perception with external textual knowledge, the project will demonstrate how language-driven context can improve an agent’s ability to interpret game states and reason about objectives and strategies. The outcome will showcase a novel approach to creating more interpretable and context-aware game AI, highlighting the potential of multimodal learning and knowledge integration in interactive environments.
