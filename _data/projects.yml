- id: proj-083
  title: "Diversity-Driven Exploration for Post-Training Large Language Models"
  supervisor: "Laura Toni"
  co_supervisors:
    - "Eduardo Pignatelli"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - machine-learning-ai
    - reinforcement-learning
  description: |
    Large Language Models (LLMs) are typically trained in three stages: supervised pre-training on internet text, post-training via reinforcement learning (e.g. PPO, DPO, GRPO), and inference-time compute for improving generation quality. While post-training methods such as RLHF and reinforcement learning with verifiable rewards have proven effective for alignment and task-specific optimisation, they largely focus on exploiting a learned reward signal rather than encouraging exploration.
    In contrast, exploration and intrinsic motivation have played a central role in reinforcement learning, with methods such as count-based bonuses, random network distillation (RND), and intrinsic curiosity modules enabling agents to discover novel behaviours in sparse-reward environments (Bellemare et al., Burda et al., Pathak et al.). However, these techniques have not been directly adapted to the post-training of LLMs, where the action space is combinatorial.
    The goal of this project is to investigate diversity-driven intrinsic reward methods in the post-training phase of LLMs to understand how different levels of diversity and forms of exploration impact the emergence of novel behaviours and capabilities beyond the base LLM model.

    Research Objectives
    Intrinsic Rewards for LLM Post-Training. Adapt classical intrinsic reward mechanisms—such as count-based exploration, random network distillation, and prediction-error-based curiosity—to the LLM post-training setting, accounting for sequence generation and high-dimensional action spaces.
    Impact of the level of diversity. Study how varying the level of diversity imposed by intrinsic rewards affects response diversity, learning stability, and task performance during post-training.
    Empirical Evaluation in Post-Training Regimes. Evaluate the proposed intrinsic reward methods within standard post-training frameworks measuring their impact on exploration, sample efficiency, and the acquisition of novel behaviours.

    References
    Marc Bellemare, Sriram Srinivasan, Georg Ostrovski, Tom Schaul, David Saxton, and Remi Munos. Unifying count-based exploration and intrinsic motivation. Advances in Neural Information Processing Systems, 29,2016.
    Yuri Burda, Harrison Edwards, Amos Storkey, and Oleg Klimov. Exploration by random network distillation. arXiv preprint arXiv:1810.12894, 2018.
    Deepak Pathak, Pulkit Agrawal, Alexei A Efros, and Trevor Darrell. Curiosity-driven exploration by self-supervised prediction. In International Conference on Machine Learning, pages 2778–2787. PMLR, 2017.
  prerequisites: "Excellent Python programming skills, very solid foundations of deep learning."
  available: false

- id: proj-084
  title: "Understanding Attention Perturbations in Graph Diffusion Models"
  supervisor: "Laura Toni"
  co_supervisors:
    - "Eduardo Pignatelli"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - machine-learning-ai
  description: |
    Diffusion-based generative models have recently achieved strong performance in graph generation tasks, successfully modeling complex global structures such as community organization, connectivity, and spectral properties [1,2]. These models typically rely on attention-based graph transformers to parameterize the reverse denoising process, producing categorical distributions over node and edge types at each diffusion step. While their empirical performance is well studied, the internal mechanisms by which such models capture different structural properties of graphs remain poorly understood.

    In parallel, recent work in image generation has shown that deliberately perturbing attention computations during diffusion sampling can reveal and control latent inductive biases of the model [3]. In particular, perturbations applied at different locations and granularities (e.g., layer-level vs head-level) lead to qualitatively distinct generation behaviors, and selective perturbation of specific attention heads enables fine-grained control over model outputs without retraining [3]. This raises a natural but unexplored question:
    Can attention perturbation be used as a principled tool to probe and control structural inductive biases in graph diffusion models?

    Unlike images, graphs do not admit obvious visual notions of “style.” However, graph generators implicitly encode preferences over structural properties, such as degree distributions, clustering, motif formation, community strength, and global connectivity. Attention heads in graph transformers are known to specialize over different structural scales and node roles [4,5], suggesting that perturbing them may selectively influence distinct aspects of graph structure rather than superficial appearance.
    This project aims to transfer and adapt perturbation-guided sampling to discrete graph diffusion models, such as DiGress [1], and systematically study how perturbations to attention heads affect the generated graph structure. By intervening directly in the attention mechanisms of the denoising network during sampling, the project will treat perturbation guidance as a causal probe into the graph generator, rather than as a purely performance-driven heuristic.

    Empirical evaluation will be conducted on standard graph generation benchmarks, comparing unguided sampling with perturbation-guided variants. Beyond potential improvements in generation quality, the primary outcome of this project is a deeper mechanistic understanding of how graph diffusion models construct structure, and whether their inductive biases can be selectively manipulated at inference time without retraining.
  prerequisites: >
    Excellent Python programming skills, solid foundations of Deep Learning, knowledge of graph
    Transformers, familiarity with diffusion models and / or flow-based generative models
    (desired).
  available: false

- id: proj-085
  title: "Transfer Learning for Pharmacodynamic Parameter Extraction from Scientific Literature"
