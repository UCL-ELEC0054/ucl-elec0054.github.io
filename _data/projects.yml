- id: proj-002
  title: "FPGA-accelerated Physics-informed Neural Networks for Optical Fibre Communications"
  supervisor: "Filipe Ferreira"
  co_supervisors:
    - "Alfonso Ruocco"
  programmes:
    - integrated-machine-learning-systems
    - wireless-and-optical-communications
    - telecommunications
    - internet-engineering
  research_areas:
    - machine-learning-ai
    - optical-communications
    - integrated-circuits-microelectronics
  description: |
    Objectives/Aims: The primary objective of this project is to develop and implement Physics-Informed Neural Networks (PINNs) on Field-Programmable Gate Arrays (FPGAs) to model and simulate the propagation of optical signals in fibre-optic communication systems. The project aims to leverage the computational efficiency of FPGAs to accelerate the training and inference processes of PINNs.

    Methodology: The project will be divided into the following key phases:
    Literature Review and Problem Formulation: Conduct an extensive review of existing methods for modelling optical fibre propagation using PINNs and FPGA acceleration. Define the specific challenges in simulating non-linear Schrödinger equations (NLSE) and their relevance to fibre-optic communications.
    Model Development: Develop a physics-informed neural network framework tailored to the NLSE governing optical fibre propagation. Implement the PINN architecture in a hardware description language (HDL) suitable for FPGA deployment.
    Validation and Testing: Validate the FPGA-accelerated PINN model against standard numerical methods and experimental data. Evaluate the model's performance in simulating various fibre propagation scenarios.

    Engineering/Scientific Novelty:
    The scientific novelty of this project is two-fold, it is the use of physics-informed neural networks and the use of FPGA technology to model complex optical phenomena in fibre communication systems. While PINNs have gained attention in modelling physical systems, their application in high-speed, real-time environments like optical fibre communications is still relatively underexplored. Additionally, leveraging FPGA acceleration offers a novel approach to overcoming the computational challenges typically associated with PINNs.
    References:
    X. Jiang, D. Wang, Q. Fan, M. Zhang, C. Lu, A. P. T. Lau, Physics-Informed Neural Network for Nonlinear Dynamics in Fiber Optics. Laser & Photonics Reviews 2022, 16, 2100483. https://doi.org/10.1002/lpor.202100483.
  prerequisites: "python"
  available: false

