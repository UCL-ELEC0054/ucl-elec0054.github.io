  description: >
    Currently the internet is default-on. Every nodes can send to every other node node. This
    makes fighting denial-of-service very hard. This project will research a new paradigm where
    some destinations indicate that there are in default-off mode and only authorised nodes can
    send data. This will involve a new BGP attribute and a new way of filtering packets at the edge
    of the network.
