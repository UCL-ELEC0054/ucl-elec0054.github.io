- id: proj-008
  title: "Physical Layer Anonymous Communications"
  supervisor: "Christos Masouros"
  co_supervisors:
    - "Anna Maria Mandalari"
  programmes:
    - wireless-and-optical-communications
    - telecommunications
    - internet-engineering
    - integrated-machine-learning-systems
  research_areas:
    - wireless-communications
    - signal-processing
    - networking-security-iot
  description: |
    In certain communication scenarios such as edge computing and healthcare applications the communication user is interested to communicating data to a receiver or data base, without revealing their identity. Anonymous communications have been studied using higher layer techniques to provide solutions to this problem. In this project we will focus on providing anonymity in the physical layer. We will design precoding solutions that ensure a reliable detection of the data signals while at the same time preserving the anonymity of the sender.

    Related reading:
    1. Z. We, F. Liu, C. Masouros, and H. V. Poor, "Fundamentals of Physical Layer Anonymous Communications: Sender Detection and Anonymous Precoding." vol. 21, no. 1, pp. 64-79, Jan. 2022
    2. Z. Wei, C. Masouros, V. Poor, A. Petropulu, and L. Hanzo, “Physical Layer Anonymous Precoding: the Path to Privacy-Preserving Communications”, IEEE. Wireless Comms., vol. 29, no. 2, pp. 154-160, April 2022
    3. R. Zhang, C. C. Chai and Y. C. Liang, "Joint Beamforming and Power Control for Multiantenna Relay Broadcast Channel With QoS Constraints," in IEEE Transactions on Signal Processing, vol. 57, no. 2, pp. 726-737, Feb. 2009.
  prerequisites: >
    The project is based on simulation of advanced communication systems in Matlab. Good
    knowledge of wireless communications, Matlab programming skills are required.
  available: false

- id: proj-009
  title: "Dual-Functional Communications and Radar transmission for 6G"
  supervisor: "Christos Masouros"
  co_supervisors:
    - "Izzat Darwazeh"
  programmes:
    - integrated-machine-learning-systems
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - wireless-communications
    - signal-processing
    - sensing-imaging
  description: |
    The explosive growth of wireless communications devices and services have brought an unprecedented congestion in UK mobile spectrum. As a result, future wireless communication systems are encouraged to share spectrum with Radar applications amongst others, to fully deliver on the technology's promise. Dual-functional systems that can simultaneously perform remote sensing and transmit useful information via classical communications appear as an essential enabler for the future, which not only ensures the cooperation between the two systems, but can also turn radar applications, which are on the rise with emerging IoT applications such as autonomous cars, into a commodity. We will design signal processing solutions for dual-functional systems that can simultaneously detect remote targets and transmit useful information.

    Related reading:
    1. B. Li, A. P. Petropulu, and W. Trappe, “Optimum co-design for spectrum sharing between matrix completion based MIMO radars and a MIMO communication system,” IEEE Transactions on Signal Processing, vol. 64, no. 17, pp. 4562–4575, Sept 2016.
    2. F. Liu, C. Masouros, A. Li, T. Ratnarajah, and J. Zhou “Interference Exploitation for Radar and Cellular Coexistence: The Power-Efficient Approach,” arXiv preprint arXiv:1704.08920v1,
    3. A. R. Chiriyath, B. Paul, and D. W. Bliss, “Radar-communications convergence: Coexistence, cooperation, and co-design,” IEEE Transactions on Cognitive Communications and Networking, vol. 3, no. 1, pp. 1–12, March 2017.
  prerequisites: >
    The project is based on simulation of advanced communication systems in Matlab. Good
    knowledge of wireless communications, Matlab programming skills are required.
  available: false

- id: proj-010
  title: "Exploiting known Interference For Physical Layer Security"
  supervisor: "Christos Masouros"
  co_supervisors:
    - "Izzat Darwazeh"
  programmes:
    - integrated-machine-learning-systems
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - wireless-communications
    - signal-processing
    - networking-security-iot
  description: |
    Recently, constructive interference (CI) technique has been proposed to enhance the performance of multi-user multiple-input multiple-output (MU-MIMO) systems. The CI technique exploits interference that can be known to the transmitter to increase the signal received power. The aim of this project will be to use the concept of the CI to increase physical layer security in MIMO systems. The project will investigate the use of constructive interference to improve the signal of legitimate users, and destructive interference to scramble the signal of eavesdroppers.

    Related reading:
    1. Christos Masouros, and Gan Zheng, “Exploiting Known Interference as Green Signal Power for Downlink Beamforming Optimization”, IEEE TRANSACTIONS ON SIGNAL PROCESSING, VOL. 63, NO. 14, JULY 15, 2015.
    2. M. R. Khandaker, C. Masouros, K. K. Wong, “Constructive Interference Based Secure Precoding: A New Dimension in Physical Layer Security”, IEEE Trans Forensics and Security., vol. 13, no. 9, pp. 2256-2268, Sept. 2018
    3. Q Xu, P Ren, AL Swindlehurst, “Rethinking secure precoding via interference exploitation: A smart eavesdropper perspective” IEEE Transactions on Information Forensics and Security 16, 585-60
  prerequisites: >
    The project is based on simulation of advanced communication systems in Matlab. Good
    knowledge of wireless communications, and Matlab programming are required.
  available: false

- id: proj-011
  title: "Project Morpho-Sight: High-Bandwidth Flexible Camera Array"
  supervisor: "Yu Wu"
  co_supervisors:
    - "Dai Jiang"
  programmes:
    - integrated-machine-learning-systems
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - sensing-imaging
    - integrated-circuits-microelectronics
    - machine-learning-ai
  description: |
    Standard multi-camera rigs are rigid and bulky. While flexible borescopes exist, they typically feature only a single tip camera. Creating a "snake" with contiguous vision requires overcoming significant signal integrity hurdles: transmitting 10 streams of raw image data and IMU telemetry over a flexible substrate without crosstalk or voltage drop.

    We propose a setup with distributed sensing and centralized processing as follows:
    The "Smart" Node Architecture: We will have N observation nodes, each on a Flexible Printed Circuit (FPC,) acting as an independent sensing unit. Each node will have a camera, IMU, and a local controller
    The Flexible Backbone: The design utilizes a strengthened FPC approach. The bus architecture routes power and high-speed data signals to the end-connector.

    FPGA Aggregation: The raw data from all N sensors is routed to the pin header, connecting to a high-end FPGA. The FPGA serves as the "Visual Cortex," performing parallel deserialization and synchronizing the N>10 video streams with the M>10 IMU pose streams.

    The key applications will include
    Industrial Inspection: A "snake robot" that can enter a pipe and inspect the entire inner circumference simultaneously, rather than just the front view.
    Medical Robotics: Next-generation endoscopy that can map the 3D shape of the colon or esophagus while capturing imagery.
  prerequisites: "Hardware and software, FPGA, PCB Design"
  available: false

