  description: |
    Internet of Things (IoT) devices are increasingly deployed in resource-constrained environments where battery longevity is a critical design requirement. While significant research has focused on network-level security threats such as denial-of-service (DoS) attacks, less attention has been given to energy-depletion attacks, where malicious or abnormal network traffic deliberately accelerates battery drain.
