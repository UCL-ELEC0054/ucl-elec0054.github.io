- id: proj-061
  title: "External cavity laser based on thin-film lithium niobate PIC"
  supervisor: "Martyn Fice"
  co_supervisors:
    - "Alfonso Ruocco"
  programmes:
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - photonics-optics
    - semiconductors-materials-devices
    - optical-communications
  description: >
    Thin-film lithium niobate (TFLN) is an exciting new platform for photonic integrated circuits
    (PICs), thanks to the wide range of electro-optic and other properties exhibited by lithium
    niobate itself and the compact and small-bend-radius waveguides enabled by placing it as a thin
    layer between silicon dioxide cladding layers. However, lithium niobate cannot generate or
    detect light, so to provide a full range of photonic functionality it must be combined with
    other materials (e.g. III-V semiconductors) in a hybrid integrated form. The EU Horizon
    project PATTERN, in which UCL is a partner, is investigating techniques for hybrid integration
    of III-V semiconductor gain and detector elements, and silicon drive circuits, on TFLN, and
    developing a process design kit (PDK) and an assembly design kit (ADK) to simplify and speed up
    the design and packaging of full-functionality PICs based on TFLN.

    An essential component in many optical sub-systems is a single-frequency, narrow-linewidth and,
    ideally, tuneable laser. Within the PATTERN project, it is proposed to develop laser building
    blocks for the TFLN PDK based on III-V semiconductor gain blocks (either butt coupled or
    micro-transfer printed) combined with extended and frequency selective external cavities on the
    TFLN material itself. The objective of this project is to characterise an experimental prototype
    laser and to analyse and model its design, with the view to developing improved laser designs
    for the TFLN platform.

    A previously designed and fabricated laser assembly (combining a TFLN PIC designed by PATTERN
    partner CSEM and a butt-coupled III-V gain block from partner HHI, assembled by partner PHIX)
    is available for testing and analysis. The main activity of the project will be the
    experimental evaluation of the laser assembly in the lab to confirm its functionality and
    determine its characteristics. In parallel, it will be required to understand the individual
    components used in the design (directional coupler, Sagnac loop mirror, micro-ring resonator)
    and model the characteristics of these components and the overall laser assembly, in order to
    compare with the experimental results.
  prerequisites: "Interest in developing practical experimental skills"
  available: true

- id: proj-062
  title: "Modelling optical injection locking"
  supervisor: "Martyn Fice"
  co_supervisors:
    - "Michael Wale"
  programmes:
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - photonics-optics
    - optical-communications
    - semiconductors-materials-devices
  description: >
    Optical injection locking (OIL) is a technique that allows one laser (the tracking laser) to
    be phase locked to another (the reference laser). It has numerous potential uses in optical
    communication systems. A small amount of light from the reference laser injected into the
    tracking laser is enough to cause the phase of the tracking laser to follow that of the
    reference laser, provided the free-running frequencies of the lasers differ by only a small
    amount.

    Optical comb frequency generators (OFCGs) produce a set of optical frequencies with
    well-defined frequency and phase relationships, which makes them useful in many applications,
    for example very dense WDM optical communication systems. However, the power in each comb line
    is often quite low and filtering out individual lines, for instance to allow them to be
    modulated, can be difficult if the comb lines are closely spaced. OIL can address both these
    issues, acting as an amplifying filter with very narrow bandwidth. However, the performance of
    OIL when injected with the multi-line output of an OFCG can be complex, so is deserving of
    further study.

    There are two main tasks in this project. First, to investigate techniques for modelling OIL,
    and then to apply them to comb-line filtering. Initially, commercial optical device modelling
    software such as OptSim will be investigated for these purposes, but if they prove unsuitable
    it may be necessary to model OIL by solving the laser rate equations using custom-written code
    in MATLAB or another programming language.
    The objective will be to calculate the residual phase error between two lines selected from a
    comb using OIL, under different conditions of injected power level, number of OFCG lines,
    comb-line spacing, etc., in order to better understand the capabilities and limitations of
    using OIL in this application.
  prerequisites: "Interest in semiconductor laser modelling"
  available: false

