  description: |
    Emerging intelligent systems are moving beyond conventional sensing paradigms that focus on raw data acquisition and reconstruction. Semantic-based intelligent sensing aims to sense, transmit, and process only the meaningful and task-relevant information required for decision-making, perception, or control. This paradigm is particularly important for future wireless and cyber-physical systems, where sensing, communication, and intelligence must be tightly integrated under strict constraints on latency, energy, and bandwidth. This MSc project investigates semantic-based intelligent sensing systems, where artificial intelligence is used to jointly design sensing, signal processing, and communication mechanisms. Instead of optimizing traditional metrics such as signal-to-noise ratio or mean squared error, the project focuses on semantic relevance, inference accuracy, and task performance. The sensing process is designed to directly extract semantic features (e.g., objects, events, states, or intents) and to efficiently convey this information to downstream AI models or networked agents.

    The project will explore the theoretical foundations of semantic sensing, including task-oriented sensing models, semantic performance metrics, and trade-offs between sensing accuracy, communication overhead, and computational complexity. Building on this, the student will develop AI-driven algorithms for semantic feature extraction, representation learning, and task-oriented sensing. These algorithms may be integrated with novel signal and waveform designs, where sensing signals are optimized to embed semantic information under limited bandwidth or to support joint sensing and communication functionalities.

    Research Tasks will focus on:
    • AI-based semantic sensing algorithms (e.g., deep learning, representation learning, or reinforcement learning)
    • End-to-end simulations using MATLAB or Python to evaluate performance trade-offs
    • Semantic performance metrics (e.g., task error, inference accuracy, semantic distortion)
    • Joint optimization of sensing, communication, and learning
    • Demonstration of semantic-aware sensing and decision-making
    • Proof-of-concept Prototyping and experimental validation using RF sensing hardware, data acquisition systems, or software-defined radios (SDR) based platforms
    • Excellent results would be possible for IEEE publications.
  prerequisites: >
    (a)Understanding of machine learning, deep learning, and semantic. (b)Knowledge of sensing
    systems (e.g., radar, localization, imaging, or RF sensing). (c)Knowledge of signal processing
    and communications. (d)Experience with programming and simulation (MATLAB and/or Python).
    (e)Interest in AI-driven system design and cross-disciplinary research. (f)Experience with
    software-defined radios (SDR) or embedded platforms. (g)Knowledge of joint sensing/communication
    or edge intelligence. (h)Motivation for experimental work and research-oriented problem solving.
  available: false

