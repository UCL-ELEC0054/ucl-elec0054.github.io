  description: "Electronic systems for biomedical, healthcare, wearable, assistive, and human-interfacing applications."

integrated-circuits-microelectronics:
  label: "Integrated Circuits & Microelectronics"
  description: "Analogue, mixed-signal, CMOS, and microelectronic circuit design for electronic systems and embedded hardware."

semiconductors-materials-devices:
