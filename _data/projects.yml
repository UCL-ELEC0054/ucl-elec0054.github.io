- id: proj-086
  title: "Causal Inference and Generative Models in Dynamic Processes to Analyze and Enhance Resilience in Complex Networks"
  supervisor: "Laura Toni"
  co_supervisors:
    - "Francesca Boem"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - machine-learning-ai
  description: >
    Many critical infrastructure and environmental systems—such as water distribution networks,
    power grids, and climate systems—are best understood as dynamic processes evolving on complex
    networks. Existing machine learning approaches can predict system behaviour but often fail to
    explain why events occur, limiting their usefulness for robust decision-making. This MSc
    project will explore the foundations of causal inference and generative modelling on networks
    to analyse resilience in dynamic systems. The focus will be on developing and evaluating
    methods that (i) infer likely causal sources of observed events in networks and (ii) simulate
    future system behaviour under hypothetical interventions. Using synthetic networked data as a
    first step, the project will assess how causal and generative approaches can improve
    interpretability and support resilience-oriented analysis, laying the groundwork for
    applications in infrastructure and environmental systems.
  prerequisites: >
    strong coding skills, strong knoweldge of deep learning and general understanding of diffusion
    models and statistical learning.
  available: false

- id: proj-087
  title: "An Autonomous Reasoning Agent for Black-Box Optimization"
  supervisor: "Laura Toni"
  co_supervisors:
    - "Eduardo Pignatelli"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - machine-learning-ai
    - reinforcement-learning
  description: |
    Many real-world optimisation problems—such as those arising in sustainable energy systems, including power grid management—can be formulated as black-box optimisation tasks, where the objective function is expensive to evaluate and poorly understood. However, most existing approaches rely on blind search strategies and lack an explicit understanding of the underlying optimisation landscape.
    This MSc project will investigate the design of intelligent optimisation agents that build internal “world models” of black-box functions. The focus will be on exploring how surrogate modelling, hypothesis-driven exploration, and Bayesian reasoning can be combined to infer properties such as smoothness, curvature, or modality of an unknown objective function. Using synthetic benchmarks, the project will evaluate whether reasoning about the function space can improve sample efficiency and robustness, providing a foundation for more adaptive optimisation methods.
  prerequisites: >
    strong coding skills, strong knoweldge of deep learning and RL. Initial understanding of
    agents
  available: true

- id: proj-090
  title: "Peak-to-Average-Power Ratio (PAPR) Reduction Technique for Multicarrier Signal over Fibre Transmission"
  supervisor: "Chin-Pang Liu"
  co_supervisors: []
  programmes:
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - optical-communications
    - signal-processing
    - microwave-rf-thz
  description: >
    Optical fibre can be used to deliver radio cellular and WIFI signals in order to improve indoor
    wireless coverage. However, multicarrier signals such as the OFDM can have a rather large
    peak-to-average power-ratio (PAPR) which can easily drive a directly modulated semiconductor
    laser diode, an external Mach Zehnder Modulator (MZM) or a microwave amplifier into the
    nonlinear region, resulting in signal distortion. Clipping is seen as the simplest technique to
    forcibly limit the maximum amplitude a signal can have but such a nonlinear process produces
    distortion products both inside the signal bandwidth as well as outside. Although the
    out-of-band distortion can be filtered out after signal transmission, the in-band distortion
    cannot be filtered out without removing the original signal at the same time. The objective of
    this project is therefore to investigate a novel PAPR reduction technique which will only
    retain the out-of-band distortion product. The effectiveness of such a PAPR reduction technique
    will be assessed by simulation using OFDM signals and verified experimentally.
  prerequisites: ""
  available: false

- id: proj-091
  title: "Digitised RF over fibre"
  supervisor: "Chin-Pang Liu"
  co_supervisors: []
  programmes:
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - optical-communications
    - signal-processing
    - microwave-rf-thz
  description: >
    Radio-over-fibre (RoF) technology refers to the transmission of wireless signals over optical
    fibre in their respective passbands. Conventionally, different wireless signals having
    different operating frequencies are combined together before directly modulating a laser diode
    and transmission over fibre. Because of the analogue nature of the technique, the noise and
    nonlinearity of the semiconductor laser diode as well as the dispersion in the fibre can have a
    great impact on the quality of the transmitted wireless signals. More recently, it has been
    proposed that the wireless signals are first digitally sampled or digitised, and only the
    sampled data are sent over fibre in order to reduce the detrimental effects on the signals due
    to the above-mentioned imperfections. However, employing analogue-to-digital converters (ADCs)
    and digital-to-analogue converters (DACs) for digitising and reconstructing the wireless
    signals bring about a new set of limitations such as the phase noise or clock jitters,
    quantisation noise, nonlinearity and non-flat frequency response 60 due to the zero-order-hold
    effect from the DACs. In this project, the student will simulate the aforementioned effects on
    the digitised wireless signals such as 16-QAM and establish a quantitative relationship between
    these effects and the quality of the 16-QAM.
  prerequisites: ""
  available: false
