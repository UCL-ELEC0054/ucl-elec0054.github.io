- id: proj-072
  title: "Proving that Options Can Address Temporal Credit Assignment"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - machine-learning-ai
  description: |
    A key capability behind successful reinforcement learning (RL) is assigning credit: understanding how an agent’s past decisions contributed to outcomes such as winning, losing, or triggering a valuable event. In many environments, these outcomes depend on decisions made far in the past, creating long-term dependencies. Learning to associate distant actions with delayed consequences is known as the temporal credit assignment problem (CAP).

    Options—temporally extended, “macro” actions—are a natural candidate solution. Rather than selecting low-level moves (e.g., left/right/up/down), an agent can select higher-level behaviours (e.g., “find the key”, “open the door”), shortening the effective decision horizon and potentially improving credit propagation.

    Despite their intuitive appeal, there is no definitive empirical demonstration showing that options reliably mitigate temporal CAP in a challenging, unsolved setting.

    In this project, we aim to provide strong evidence. We will use NetHack, a notoriously difficult long-horizon RL benchmark. We will define a set of meaningful high-level options (e.g., “reach the next level”, “acquire a critical item”), hard-code their execution (i.e., how each option is carried out at the action level), and train a policy over options rather than primitive actions. The core goal is to test whether option-level control yields stronger, more sample-efficient policies than standard action-level RL.
  prerequisites: >
    Excellent Reinforcement Learning theory; solid Deep Learning foundations; prior implementation
    of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-073
  title: "Future-conditional Large Language Models"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - machine-learning-ai
  description: |
    Large Language Models (LLMs) represent knowledge through natural language by autoregressively predicting the next token from a fixed vocabulary. Recently, “reasoning-style” approaches—explicit decomposition into sequential subtasks and plans—have significantly improved performance on long-horizon, agentic tasks.

    This project explores a complementary hypothesis: long-term intentions can be encoded directly in token representations. Instead of treating the vocabulary as fixed, we aim to learn token embeddings that capture longer-range dependencies by conditioning not only on the past context but also on future context.

    Concretely, we will start from a standard Transformer language-model architecture (e.g., GPT-2–style) and a large text corpus (e.g., Wikipedia). After tokenisation, we will train an embedding/encoder model that predicts the current token given both a window of preceding tokens and a window of subsequent tokens (a future-conditional objective). The aim is to learn embeddings that better reflect long-term structure and “intent” in text, and to evaluate whether these embeddings improve downstream modelling or planning-like behaviour.
  prerequisites: >
    Excellent Deep Learning theory; good understanding of LLMs/Transformers; prior implementation
    of at least one deep learning model; excellent coding skills.
  available: false

- id: proj-074
  title: "Unsupervised options discovery in Reinforcement Learning"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - machine-learning-ai
  description: |
    A central challenge in RL is temporal credit assignment: outcomes often depend on decisions made far in the past, and the agent must learn which decisions were responsible. Options—temporally extended actions—can help by operating at a higher level of abstraction (e.g., “navigate to a room” rather than “move left”).

    However, hand-designing options is costly, highly domain-dependent, and hard to generalise across tasks. This project investigates whether useful options can be discovered without action labels.

    We will collect actionless demonstrations—sequences of states or frames with no annotated actions (e.g., videos). The student will train a latent action model that predicts the transition between a past context and a future context, learning discrete or continuous latent “actions” that explain what happened in between. The resulting latent action space can be interpreted as a learned set of options or macro-actions, ideally capturing long-term effects.

    The goal is to assess (1) whether such latent actions are learnable from actionless data, and (2) whether they encode temporally extended structure that transfers to RL control.
  prerequisites: >
    Excellent Reinforcement Learning theory; solid Deep Learning foundations; prior implementation
    of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-075
  title: "Learning jumpy world models: taking many actions at once"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - machine-learning-ai
  description: |
    Long-horizon RL tasks often feature sparse and delayed rewards, making credit assignment difficult. In model-based RL, agents typically learn one-step dynamics models that predict the next state from the current state and action. While effective in some settings, one-step prediction forces long-horizon reasoning to be built from many short steps, which can make learning and planning brittle.

    This project studies jumpy world models that skip intermediate steps. Given a current state and a sequence of actions, the model predicts the state after executing the entire sequence—without explicitly generating intermediate states. The policy chooses how long to “jump” via a termination mechanism: the probability of emitting an EOS (end-of-sequence) action is tied to an action-gap signal, e.g., the difference between the best action-value and the runner-up (or an average baseline). Intuitively, the model takes longer jumps when decisions are easy and stops when the agent reaches a decision bottleneck.

    The student will implement jumpy models in simple environments, compare them to standard one-step models, and explore how they can support planning and policy learning under sparse/delayed rewards.
  prerequisites: >
    Excellent Reinforcement Learning theory; solid Deep Learning foundations; prior implementation
    of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-076
  title: "Learning jumpy policies: taking many actions at once"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - machine-learning-ai
  description: |
    Standard RL agents act one step at a time and learn from short transitions. In long-horizon problems with sparse or delayed rewards, this makes temporal credit assignment especially hard: it’s unclear which individual steps contributed to the final outcome.

    This project explores a different control interface: the policy outputs a variable-length sequence of actions from a single observation, which is executed open-loop (without observing intermediate states). As in jumpy world models, termination is governed by an EOS token, with probability linked to an action-gap signal (e.g., the value difference between the best and second-best actions). The underlying idea is to compress “easy” stretches into longer open-loop segments and reserve feedback/decision-making for bottlenecks.

    In practice, the student will design and implement sequence policies, train them in simple RL environments, and compare them to step-by-step baselines—focusing on sample efficiency, robustness, and performance under sparse/delayed rewards.
  prerequisites: >
    Excellent Reinforcement Learning theory; solid Deep Learning foundations; prior implementation
    of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-077
  title: "Unsupervised goal discovery via relative advantage"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - machine-learning-ai
  description: |
    This project investigates whether “decision bottlenecks” can be detected and used as unsupervised goals. The setup combines (1) a policy-gradient method with a critic, and (2) a binary classifier that learns to flag bottleneck states.

    The binary model is trained on a signal derived from the critic: if the maximum advantage gap among available actions in a state exceeds a threshold, the label is 1; otherwise 0. The intuition is that when an agent reaches a state where one choice is much better than all others, the environment is presenting a meaningful decision point—often corresponding to an intermediate objective being reached or a critical choice being required.

    The student will implement the method, test whether detected bottlenecks correlate with interpretable subgoals, and evaluate whether these discovered goals can improve exploration or hierarchical learning.
  prerequisites: >
    Excellent Reinforcement Learning theory; solid Deep Learning foundations; prior implementation
    of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-078
  title: "earning Easy Optimal Policies"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - reinforcement-learning
    - machine-learning-ai
  description: |
    Among optimal policies, some are more robust than others: in many states, multiple actions may be near-equally good, meaning the agent does not need to execute a brittle, highly specific sequence to succeed. Such policies are “easier” to follow and more tolerant to noise, approximation error, or small distribution shifts.

    This project formalises and targets that notion of ease. The objective is to learn policies that (1) achieve high return, while (2) exhibiting low variance in the advantage distribution within a state—i.e., avoiding states where the policy must pick a single precise action to remain optimal.

    In practice, the student will modify RL objectives or regularisers to encourage robust action sets, evaluate robustness and performance across environments, and compare against standard maximum-return baselines.
  prerequisites: >
    Excellent Reinforcement Learning theory; solid Deep Learning foundations; prior implementation
    of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-079
  title: "Latent Action Modelling for 3D Molecule Generation"
  supervisor: "Eduardo Pignatelli"
  co_supervisors:
    - "Miguel Rio"
  programmes:
    - integrated-machine-learning-systems
  research_areas:
    - machine-learning-ai
    - reinforcement-learning
  description: |
    Language-model-inspired approaches to molecular generation have shown strong results in 1D representations (e.g., SMILES). Extending these ideas to 3D molecular structures is substantially harder because atomic coordinates are continuous, making modelling and optimisation in molecule space more challenging—especially when applying reinforcement learning (RL) or search-based refinement.

    This project explores discrete latent action modelling for 3D molecule generation: instead of directly predicting continuous coordinate updates, the model learns a set of discrete latent “actions” that represent meaningful structural transformations in 3D (e.g., local geometric adjustments, fragment movements, conformational changes). These latent actions can then be optimised using RL-style objectives to improve properties of interest.

    The student will prototype latent-action generators for 3D molecules and investigate how well RL can optimise in this discrete latent action space compared to continuous baselines.
  prerequisites: >
    Solid Deep Learning foundations; excellent Reinforcement Learning knowledge; prior
    implementation of at least one deep RL algorithm; excellent coding skills.
  available: false

- id: proj-080
  title: "Energy Optimization for future mobile networks using RAN Digital Twins"
  supervisor: "Christos Masouros"
  co_supervisors:
    - "nishita.hathi@uclmail.net"
  programmes:
    - integrated-machine-learning-systems
    - internet-engineering
    - telecommunications
    - wireless-and-optical-communications
  research_areas:
    - machine-learning-ai
    - wireless-communications
  description: |
    1. Abstract
    As mobile networks evolve into critical utilities, the primary challenge shifts from increasing peak bit rates to reducing operational expenditure (OpEx), specifically energy consumption. This project proposes the development and validation of AI-driven energy optimization algorithms within a high-fidelity Network Digital Twin (NDT). By leveraging the NVIDIA Aerial Omniverse Digital Twin framework, the research will simulate a realistic urban RAN environment. The project aims to demonstrate how AI models can facilitate "Less ON, More OFF" strategies to achieve cost reductions without compromising Quality of Service (QoS).

    2. Background and Motivation
    Mobile networks are often criticized for their high energy footprint, largely due to "always-on" signaling requirements. 6G is envisioned as AI-native, meaning that while data formats and interfaces are standardized, the optimization logic remains proprietary and intelligent.
    There is a growing industry consensus that 6G should not merely be "5G on steroids" but a move toward sustainability and cost-efficiency. Energy is the single largest OpEx for operators; The motivation for this project is to move beyond static, rule-based power saving to predictive, contextual optimization enabled by AI.

    3. Aims and Objectives
    The primary aim is to evaluate the effectiveness of AI-driven energy optimization leveraging digital twin environment.
    •
    Objective 1: To set up a functional Radio Access Network (RAN) digital twin of a specific using NVIDIA Omniverse and Aerial.
    •
    Objective 2: To analyze current energy-saving algorithms
    •
    Objective 3: To implement and test at least one AI-based optimization algorithm within the digital twin.
    •
    Objective 4: To quantify the trade-off between energy savings and network performance (latency/throughput) through comparative simulation.
  prerequisites: >
    This will require learning of NVIDIA's Aerial Omniverse Digital Twin platform and access to
    the departments GPUs
  available: false

