control-systems:
  label: "Control Systems"
  description: "Control theory and engineering for dynamical systems, including fault diagnosis, fault-tolerant control, estimation, and robust control."

signal-processing:
  label: "Signal Processing"
  description: "Methods for analysing, modelling, transforming, and optimising signals, including waveform design, compressed sensing, and digital signal processing."

machine-learning-ai:
  label: "Machine Learning & AI"
  description: "Machine learning and AI methods, including statistical learning, intelligent systems, distributed ML, and AI-enabled engineering."

reinforcement-learning:
  label: "Reinforcement Learning & Decision Making"
  description: "Sequential decision making, adaptive control, and reinforcement learning for agents interacting with complex environments."

wireless-communications:
  label: "Wireless Communications"
